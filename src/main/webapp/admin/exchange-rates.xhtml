<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/templates/admin-layout.xhtml">
    <ui:define name="title">Exchange Rates - SubTrack Admin</ui:define>

    <ui:define name="content">
        <div class="page-header" style="margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="color: #1A1A1A; font-size: 22px; font-weight: 700;">Exchange Rate Management</h1>
                <p style="color: #5F5E5A; font-size: 14px;">Current exchange rates stored in the EXCHANGE_RATE table</p>
            </div>
            <h:form>
                <h:commandButton value="Refresh All Rates" action="#{adminExchangeRateBean.refreshAllRates}" styleClass="btn-primary"/>
            </h:form>
        </div>

        <div class="card">
            <h:form id="ratesForm">
                <h:dataTable value="#{adminExchangeRateBean.exchangeRates}" var="rate" styleClass="data-table"
                             rendered="#{not empty adminExchangeRateBean.exchangeRates}">
                    <h:column>
                        <f:facet name="header">Currency</f:facet>
                        <span style="font-weight: 600; font-size: 15px; color: #1A1A1A;">#{rate.currencyCode}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Rate to MAD</f:facet>
                        <h:outputText value="#{rate.rateToMad}"><f:convertNumber pattern="#,##0.0000"/></h:outputText>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Last Updated</f:facet>
                        <h:outputText value="#{rate.lastUpdated}"><f:convertDateTime type="both" dateStyle="medium" timeStyle="short"/></h:outputText>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Freshness</f:facet>
                        <span class="status-indicator #{rate.fresh ? 'operational' : 'unreachable'}">
                            <span class="dot"></span> #{rate.fresh ? 'Fresh' : 'Stale'}
                        </span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Actions</f:facet>
                        <h:commandButton value="Edit" styleClass="btn-secondary" style="padding: 4px 10px; font-size: 12px;">
                            <f:setPropertyActionListener target="#{adminExchangeRateBean.selectedRate}" value="#{rate}"/>
                        </h:commandButton>
                    </h:column>
                </h:dataTable>

                <h:panelGroup rendered="#{empty adminExchangeRateBean.exchangeRates}">
                    <div class="empty-state"><p>No exchange rates stored. Click "Refresh All Rates" to fetch them.</p></div>
                </h:panelGroup>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
</html>
