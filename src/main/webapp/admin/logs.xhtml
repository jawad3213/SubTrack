<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<ui:composition template="/templates/admin-layout.xhtml">
    <ui:define name="title">System Logs - SubTrack Admin</ui:define>

    <ui:define name="content">
        <div class="page-header" style="margin-bottom: 28px; display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 style="color: #1A1A1A; font-size: 22px; font-weight: 700;">System Logs</h1>
                <p style="color: #5F5E5A; font-size: 14px;">Application-level system log viewer</p>
            </div>
            <div style="display: flex; gap: 8px;">
                <h:form>
                    <h:commandButton value="Export CSV" action="#{adminLogBean.exportCsv}" styleClass="btn-secondary"/>
                    <h:commandButton value="Clear Old Logs" action="#{adminLogBean.clearOldLogs}" styleClass="btn-danger" style="margin-left: 8px;"
                                     onclick="return confirm('Clear logs older than 30 days?');"/>
                </h:form>
            </div>
        </div>

        <h:form id="logForm">
            <div class="admin-filter-bar">
                <h:selectOneMenu value="#{adminLogBean.filterLevel}">
                    <f:selectItem itemLabel="All Levels" itemValue=""/>
                    <f:selectItem itemLabel="INFO" itemValue="INFO"/>
                    <f:selectItem itemLabel="WARN" itemValue="WARN"/>
                    <f:selectItem itemLabel="ERROR" itemValue="ERROR"/>
                </h:selectOneMenu>
                <h:inputText value="#{adminLogBean.searchKeyword}" placeholder="Search in messages..." />
                <h:commandButton value="Search" action="#{adminLogBean.applyFilters}" styleClass="btn-primary" style="height:34px; padding: 0 16px; font-size: 13px;"/>
            </div>

            <div class="card">
                <h:dataTable value="#{adminLogBean.logs}" var="log" styleClass="data-table"
                             rendered="#{not empty adminLogBean.logs}">
                    <h:column>
                        <f:facet name="header">Timestamp</f:facet>
                        <span style="font-size: 12px; color: #5F5E5A; white-space: nowrap;">
                            <h:outputText value="#{log.timestamp}"><f:convertDateTime type="both" dateStyle="short" timeStyle="medium"/></h:outputText>
                        </span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Level</f:facet>
                        <span class="log-badge #{log.level.toLowerCase()}">#{log.level}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Source</f:facet>
                        <span style="font-family: monospace; font-size: 12px; color: #5F5E5A;">#{log.sourceClass}</span>
                    </h:column>
                    <h:column>
                        <f:facet name="header">Message</f:facet>
                        <span style="font-size: 13px;">#{log.message}</span>
                    </h:column>
                </h:dataTable>

                <h:panelGroup rendered="#{empty adminLogBean.logs}">
                    <div class="empty-state"><p>No system logs found. Logs will appear here as the application runs.</p></div>
                </h:panelGroup>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
</html>
