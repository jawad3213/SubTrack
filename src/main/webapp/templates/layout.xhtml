<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title><ui:insert name="title">SubTrack</ui:insert></title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet name="css/style.css"/>
    <script>
        function showTab(tabId, clickedEl) {
            document.querySelectorAll('.tab-pane').forEach(function(p) { p.style.display = 'none'; });
            document.querySelectorAll('.nav-tabs li').forEach(function(li) { li.classList.remove('active'); });
            document.getElementById(tabId).style.display = 'block';
            if (clickedEl) clickedEl.parentElement.classList.add('active');
        }
        document.addEventListener('DOMContentLoaded', function() {
            var firstPane = document.querySelector('.tab-pane');
            if (firstPane) { firstPane.style.display = 'block'; }
            var firstTab = document.querySelector('.nav-tabs li');
            if (firstTab) { firstTab.classList.add('active'); }
        });
    </script>
</h:head>

<h:body>
    <h:messages id="globalMessages" globalOnly="true" styleClass="global-messages" errorClass="alert alert-danger"
                infoClass="alert alert-success" warnClass="alert alert-warning" layout="list"/>
    <div class="main-wrapper">
        <h:panelGroup rendered="#{userContext.loggedIn}">
            <div class="dashboard-container">
                <ui:include src="/templates/sidebar.xhtml"/>
                <div class="main-content">
                    <ui:insert name="content">
                        <p>Content goes here</p>
                    </ui:insert>
                </div>
            </div>
        </h:panelGroup>
        <h:panelGroup rendered="#{not userContext.loggedIn}">
            <div class="login-prompt" style="text-align:center; padding:100px 20px;">
                <h2 style="color:#1A1A1A;">Access Denied</h2>
                <p style="color:#5F5E5A; margin:20px 0;">Please <h:link outcome="/login" value="log in"/> to access this page.</p>
            </div>
        </h:panelGroup>
    </div>
</h:body>

</html>
