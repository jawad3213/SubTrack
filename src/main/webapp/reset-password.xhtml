<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:html5="http://xmlns.jcp.org/jsf/passthrough">
<f:metadata>
    <f:viewParam name="token" value="#{forgotPasswordController.resetToken}"/>
</f:metadata>
<h:head>
    <title>Reset password - SubTrack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet name="css/auth.css"/>
</h:head>
<h:body>
    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="logo-block">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <span class="brand-name">SubTrack</span>
            </div>

            <div class="auth-header" style="margin-bottom: 1.5rem;">
                <h1 class="page-title">Choose a new password</h1>
                <p class="page-subtitle">At least 8 characters, with upper and lower case letters and a digit</p>
            </div>

            <h:form id="resetForm" prependId="false" styleClass="auth-form">
                <h:inputHidden value="#{forgotPasswordController.resetToken}"/>

                <!-- On postback the token is re-checked by resetPassword(); evaluating it here would
                     hide the inputs before the hidden token field has been applied. -->
                <h:panelGroup rendered="#{facesContext.postback or forgotPasswordController.tokenValid}">
                    <div class="form-group">
                        <h:outputLabel for="newPassword" value="New password" styleClass="form-label"/>
                        <h:inputSecret id="newPassword"
                                       value="#{forgotPasswordController.newPassword}"
                                       required="true"
                                       requiredMessage="Password is required"
                                       styleClass="form-input"/>
                        <h:message for="newPassword" styleClass="field-error"/>
                    </div>

                    <div class="form-group">
                        <h:outputLabel for="confirmPassword" value="Confirm password" styleClass="form-label"/>
                        <h:inputSecret id="confirmPassword"
                                       value="#{forgotPasswordController.confirmPassword}"
                                       required="true"
                                       requiredMessage="Please confirm the password"
                                       styleClass="form-input"/>
                        <h:message for="confirmPassword" styleClass="field-error"/>
                    </div>

                    <h:messages globalOnly="true" errorClass="msg-error" infoClass="msg-success"/>

                    <h:commandButton value="Reset password"
                                     action="#{forgotPasswordController.resetPassword}"
                                     styleClass="btn-primary"/>
                </h:panelGroup>

                <h:panelGroup rendered="#{not facesContext.postback and not forgotPasswordController.tokenValid}">
                    <div class="msg-error">This reset link is invalid or has expired.</div>
                </h:panelGroup>

                <div class="auth-footer">
                    <h:link outcome="forgot-password" value="Request a new link" styleClass="auth-link"/>
                    · <h:link outcome="login" value="Back to sign in" styleClass="auth-link"/>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
