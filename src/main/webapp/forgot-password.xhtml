<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:html5="http://xmlns.jcp.org/jsf/passthrough">
<h:head>
    <title>Forgot password - SubTrack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <h:outputStylesheet name="css/auth.css"/>
</h:head>
<h:body>
    <div class="auth-wrapper">
        <div class="auth-card">

            <div class="logo-block">
                <div class="logo-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </div>
                <span class="brand-name">SubTrack</span>
            </div>

            <div class="auth-header" style="margin-bottom: 1.5rem;">
                <h1 class="page-title">Forgot password</h1>
                <p class="page-subtitle">We'll email you a link to reset it</p>
            </div>

            <h:form id="forgotForm" prependId="false" styleClass="auth-form">

                <h:panelGroup rendered="#{not forgotPasswordController.tokenSent}">
                    <div class="form-group">
                        <h:outputLabel for="email" value="Email address" styleClass="form-label"/>
                        <h:inputText id="email"
                                     value="#{forgotPasswordController.email}"
                                     required="true"
                                     requiredMessage="Email is required"
                                     validatorMessage="Invalid email format"
                                     styleClass="form-input"
                                     html5:placeholder="name@company.com">
                            <f:validateRegex pattern="^[^@\s]+@[^@\s]+\.[^@\s]+$"/>
                        </h:inputText>
                        <h:message for="email" styleClass="field-error"/>
                    </div>
                </h:panelGroup>

                <h:messages globalOnly="true" errorClass="msg-error" infoClass="msg-success"/>

                <h:commandButton value="Send reset link"
                                 action="#{forgotPasswordController.requestReset}"
                                 rendered="#{not forgotPasswordController.tokenSent}"
                                 styleClass="btn-primary"/>

                <div class="auth-footer">
                    <h:link outcome="login" value="Back to sign in" styleClass="auth-link"/>
                </div>
            </h:form>
        </div>
    </div>
</h:body>
</html>
