<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<ui:composition template="/templates/layout.xhtml">
    <ui:define name="title">Connecting Email - SubTrack</ui:define>
    
    <ui:define name="content">
        <div class="page-header" style="margin-bottom: 30px;">
            <h1 style="color: #1A1A1A;">Connecting Your Email</h1>
            <p style="color: #5F5E5A;">Please wait while we complete the connection...</p>
        </div>

        <div class="card" style="max-width: 500px; text-align: center;">
            <h:form>
                <p>Processing your authorization...</p>
                <h:inputHidden value="#{param.code}" id="code"/>
                <h:inputHidden value="#{param.state}" id="state"/>
                
                <h:commandButton value="Complete Connection" 
                                 action="#{emailController.handleOAuthCallback(param.code, param.state)}" 
                                 styleClass="btn-primary"
                                 style="display: none;"/>
            </h:form>
            
            <script>
                document.addEventListener('DOMContentLoaded', function() {
                    document.querySelector('form').submit();
                });
            </script>
        </div>
    </ui:define>
</ui:composition>
</html>
