<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<f:metadata>
    <f:viewParam name="code" value="#{emailController.oauthCode}"/>
    <f:viewParam name="state" value="#{emailController.oauthStateParam}"/>
    <f:viewAction action="#{emailController.handleOAuthCallbackAction()}"/>
</f:metadata>

<ui:composition template="/templates/layout.xhtml">
    <ui:define name="title">Connecting Email - SubTrack</ui:define>
    
    <ui:define name="content">
        <div class="page-header" style="margin-bottom: 30px;">
            <h1 style="color: #1A1A1A;">Connecting Your Email</h1>
            <p style="color: #5F5E5A;">Please wait while we complete the connection...</p>
        </div>

        <div class="card" style="max-width: 500px; text-align: center;">
            <p>Processing your authorization. If you are not redirected automatically, please check your network connection.</p>
        </div>
    </ui:define>
</ui:composition>
</html>
