<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <title>500 - Something went wrong | SubTrack</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- Plain HTML on purpose: this page must render even when a JSF component fails. -->
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/style.css"/>
    <link rel="stylesheet" href="#{request.contextPath}/resources/css/dashboard.css"/>
</head>
<body>
    <div class="error-page">
        <div class="error-card server">
            <div class="error-code">500</div>
            <h1 class="error-title">Something went wrong</h1>
            <p class="error-text">An unexpected error occurred on our side. Please try again in a moment.</p>
            <div class="error-actions">
                <a class="btn-primary" href="#{request.contextPath}/dashboard.xhtml" style="text-decoration: none;">Go to dashboard</a>
                <a class="btn-secondary" href="#{request.contextPath}/" style="text-decoration: none;">Home page</a>
            </div>
        </div>
    </div>
</body>
</html>
